# ==============================================================================
# tc-log.properties (공통 로그 설정)
#
# 목적
# - tc-log-starter(logback-spring.xml)가 참조하는 공통 로그 설정을 저장소 루트
#   config/ 경로에서 일관되게 관리합니다.
# - 앱별 중복 파일을 제거하고, 운영 시 공통 로그 정책을 한 곳에서 변경할 수 있도록
#   구성합니다.
#
# 운영 원칙
# - 이 파일에는 "공통 로그 정책"만 둡니다.
# - 앱별로 달라지는 값(예: tc.logging.eqp.file-prefix)은 각 앱 전용 설정 파일에서
#   override 합니다.
#   * Gateway  : apps/tc-comm-gateway-app/config/tc-comm.properties
#   * Business : apps/tc-business-core-app/config/tc-business-core.properties
#
# 주의사항
# - spring.config.import 순서에서 이 파일이 앱 전용 설정 파일보다 먼저 로딩되어야
#   이후 앱 전용 파일의 override가 정상 반영됩니다.
# - 파일 인코딩은 UTF-8 (BOM 없음) 기준으로 관리합니다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 로그 출력 패턴
# ------------------------------------------------------------------------------
# - APP_NAME: spring.application.name 값을 사용합니다.
# - traceId/eqpId: MDC 값 기반으로 출력합니다.
# - logger는 클래스명만 출력(%logger{0})하여 로그 가독성을 높입니다.
# - 시간대는 운영 기준으로 Asia/Seoul을 사용합니다.
# 예시:
#   c.n.t.c.k.p.PartitionCommitCoordinator -> PartitionCommitCoordinator
tc.logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS, Asia/Seoul} [%-5level] [%property{APP_NAME}] [%X{traceId}] %logger{0} - %msg [PROCESS_THREAD=%thread]%n

# ------------------------------------------------------------------------------
# 2. 로그 파일 저장 기본 경로
# ------------------------------------------------------------------------------
# - APP 로그: logs/app/*
# - EQP 로그: logs/eqp/{eqpId}/*
tc.logging.file-dir=logs

# ------------------------------------------------------------------------------
# 3. 애플리케이션(APP) 로그 롤링 정책
# ------------------------------------------------------------------------------
# - max-history: 일 단위 보관 일수
# - max-size: 단일 파일 최대 크기
# - total-size-cap: APP 로그 전체 용량 상한
tc.logging.app.max-history=14
tc.logging.app.max-size=100MB
tc.logging.app.total-size-cap=5GB

# ------------------------------------------------------------------------------
# 4. 설비(EQP) 로그 롤링 정책 (공통)
# ------------------------------------------------------------------------------
# - EQP 로그는 eqpId별 디렉터리 하위로 분리 저장됩니다.
# - 파일명 prefix는 앱별 역할(gateway/business)에 따라 달라지므로 이 파일에서
#   정의하지 않습니다. 반드시 앱 전용 설정 파일에서 지정하십시오.
tc.logging.eqp.max-history=14
tc.logging.eqp.max-size=100MB
tc.logging.eqp.total-size-cap=5GB

# ------------------------------------------------------------------------------
# 5. 로그 압축 정책
# ------------------------------------------------------------------------------
# - 최근 N일 이내 로그는 원본(.log) 유지
# - 그 이전 로그는 .gz 압축
# - scan interval마다 압축/정리 작업을 수행
tc.logging.compress.enabled=true
tc.logging.compress.after-days=2
tc.logging.compress.scan-interval-minutes=60
