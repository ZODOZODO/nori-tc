########################################
# (B-4) Oracle (DISABLED)
########################################
# 주의: Oracle은 SID/ServiceName 환경에 따라 URL 형식이 달라집니다.
# 예) ServiceName: jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
# 예) SID:         jdbc:oracle:thin:@localhost:1521:ORCLCDB
# spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
# spring.datasource.username=nori
# spring.datasource.password=REDACTED_DB_PASSWORD

################################################################################
# [C] 기술 선택 - JPA / MyBatis (딱 1개 starter만 dependencies로 선택하는 것이 "정답")
# - properties는 함께 있어도 되지만, 실제 활성화는 "starter 선택"으로 결정됩니다.
################################################################################

########################################
# (C-1) JPA/Hibernate 설정 (DEFAULT: ENABLED 가정)
########################################
# 스키마 관리 도구(Flyway 등)를 사용하지 않기로 했으므로 ddl-auto는 none/validate를 권장합니다.
# spring.jpa.hibernate.ddl-auto=validate

# spring.jpa.open-in-view=false
# spring.jpa.show-sql=false

# Hibernate timezone (FIX: 기본은 UTC로 둠)
# spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JPA 성능/운영 옵션(선택)
# spring.jpa.properties.hibernate.format_sql=false
# spring.jpa.properties.hibernate.jdbc.batch_size=50
# spring.jpa.properties.hibernate.order_inserts=true
# spring.jpa.properties.hibernate.order_updates=true

########################################
# (C-2) MyBatis 설정 (DISABLED: MyBatis starter 선택 시 주석 해제)
########################################
# MyBatis Mapper XML 위치 (common/site 모두 지정: site는 비어 있어도 무해)
mybatis.mapper-locations=classpath*:mybatis/common/*.xml,classpath*:mybatis/site/*.xml

# MyBatis 설정(선택)
# mybatis.configuration.map-underscore-to-camel-case=true
# mybatis.configuration.jdbc-type-for-null=NULL

