################################################################################
# tc-db.properties (FIX)
#
# 목적
# - 앱/모듈들은 DB 벤더/기술(JPA/MyBatis)을 "코드로" 알 필요가 없게 만든다.
# - 실제 선택은:
#   (1) app build.gradle.kts에서 starter 1개만 dependencies로 선택
#   (2) 여기 properties에서 해당 DB 접속 정보를 활성화(주석 해제)
#
# 기본값(FIX)
# - PostgreSQL + JPA
# - dbname=dev_tc / username=nori / password=REDACTED_DB_PASSWORD
#
# 주의
# - vendor 모듈은 삭제했으므로, 드라이버는 각 starter에 runtimeOnly로 포함된다.
# - Spring Boot는 기본적으로 HikariCP를 사용한다(spring.datasource.hikari.* 로 조정 가능).
################################################################################

################################################################################
# [A] 공통 DataSource (HikariCP) 옵션 (선택)
################################################################################
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000
# spring.datasource.hikari.validation-timeout=5000
# spring.datasource.hikari.keepalive-time=0

################################################################################
# [B] DB 벤더 선택 (딱 1개만 활성화)
################################################################################

########################################
# (B-1) PostgreSQL (DEFAULT: ENABLED)
########################################
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/dev_tc
spring.datasource.username=nori
spring.datasource.password=REDACTED_DB_PASSWORD

# PostgreSQL 참고 옵션(선택)
# spring.datasource.hikari.data-source-properties.stringtype=unspecified

########################################
