# ==============================================================================
# 공통 로그 설정 [TC-BUSINESS-CORE-APP]
# - tc-log-starter(logback-spring.xml)에서 참조하는 외부 프로퍼티입니다.
# - 앱/장비 로그 롤링, 압축 정책을 운영환경에서 조정할 수 있도록 분리합니다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 로그 패턴
# ------------------------------------------------------------------------------
# traceId/eqpId를 포함해 추적성을 확보합니다.
tc.logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [${APP_NAME}] [%X{traceId}] %logger{36} - %msg [PROCESS_THREAD=%thread]%n

# ------------------------------------------------------------------------------
# 2. 로그 저장 경로
# ------------------------------------------------------------------------------
tc.logging.file-dir=logs

# ------------------------------------------------------------------------------
# 3. 애플리케이션 로그 롤링 정책
# ------------------------------------------------------------------------------
tc.logging.app.max-history=14
tc.logging.app.max-size=100MB
tc.logging.app.total-size-cap=5GB

# ------------------------------------------------------------------------------
# 4. 설비(eqpid) 로그 롤링 정책
# ------------------------------------------------------------------------------
tc.logging.eqp.max-history=14
tc.logging.eqp.max-size=100MB
tc.logging.eqp.total-size-cap=5GB

# ------------------------------------------------------------------------------
# 5. 로그 압축 정책
# ------------------------------------------------------------------------------
# 최신 2일 로그는 원본 유지, 그 이전 로그는 gzip 압축합니다.
tc.logging.compress.enabled=true
tc.logging.compress.after-days=2
tc.logging.compress.scan-interval-minutes=60
