# ==============================================================================
# 로그 설정 [TC-UI-BACKEND-APP]
#
# 설계 배경
# - 공통 로그 정책은 저장소 루트 config/tc-log.properties 기준을 따릅니다.
# - UI Backend는 REST API 서버로, 설비(EQP)별 로그 파일 분리가 필요 없습니다.
#   → tc.logging.eqp.* 설정은 이 앱에서 사용하지 않습니다.
# - 아래 값이 설정되면 root config 기본값을 override 합니다.
#
# 운영 참고
# - 로그 파일 위치: {tc.logging.file-dir}/app/tc-ui-backend-app.{날짜}.{N}.log
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 로그 출력 패턴
# - 공통 패턴을 사용합니다 (아래 주석 해제 시 앱별 패턴으로 override 가능)
# ------------------------------------------------------------------------------
# tc.logging.pattern=<커스텀 패턴>
tc.logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS, Asia/Seoul} [%-5level] [%X{traceId}] %msg [%property{APP_NAME} - %logger{0}] [PROCESSED=%thread]%n

# ------------------------------------------------------------------------------
# 2. 로그 파일 저장 경로
# ------------------------------------------------------------------------------
tc.logging.file-dir=logs

# ------------------------------------------------------------------------------
# 3. 애플리케이션 로그 롤링 정책
# - UI Backend는 HTTP 요청/응답이 주된 로그이므로 14일 보관, 100MB 단위 롤링을 적용합니다.
# ------------------------------------------------------------------------------
tc.logging.app.max-history=14
tc.logging.app.max-size=100MB
tc.logging.app.total-size-cap=5GB

# ------------------------------------------------------------------------------
# 4. 로그 압축 정책
# - 최근 2일 이내 로그는 원본 유지, 그 이전은 .gz 압축
# ------------------------------------------------------------------------------
tc.logging.compress.enabled=true
tc.logging.compress.after-days=2
tc.logging.compress.scan-interval-minutes=60
