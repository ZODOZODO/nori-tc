# ==============================================================================
# TC-UI-BACKEND-APP 로컬(local) 프로파일 오버라이드 설정
#
# 사용 방법
# - 실행 시 spring.profiles.active=local 을 지정하면 이 파일이 자동 import 됩니다.
# - 본 파일에는 로컬 개발 편의를 위한 완화 정책만 최소한으로 둡니다.
# ==============================================================================

# 로컬에서는 HTTP(비 TLS) 환경 테스트를 위해 Secure=false를 사용합니다.
tc.ui.backend.auth.cookie-secure=false

# 로컬에서는 기본적으로 same-site 요청을 허용하는 Lax 정책을 사용합니다.
tc.ui.backend.auth.cookie-same-site=Lax
