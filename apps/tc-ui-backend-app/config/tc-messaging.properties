# ==============================================================================
# Messaging 설정 [TC-UI-BACKEND-APP]
# - 본 앱은 UI 요청을 받아 Business/Gateway 대상 Kafka UI 이벤트를 발행하는 진입점 템플릿입니다.
# - 현재 U13(게이트웨이 대상 고정 partition 발행)은 미구현 상태이며, 본 파일은 운영 템플릿/기본값 정리 목적입니다.
# - Redis 관련 설정은 별도 tc-redis.properties에서 관리합니다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka 공통 연결 정보
# ------------------------------------------------------------------------------
# Kafka 브로커 주소
spring.kafka.bootstrap-servers=192.168.0.13:9092

# ------------------------------------------------------------------------------
# 2. Kafka Producer 설정 (UI Backend -> Kafka)
# ------------------------------------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# ------------------------------------------------------------------------------
# 3. Kafka Consumer 설정 (Kafka -> UI Backend)
# ------------------------------------------------------------------------------
# Consumer Group은 앱 단위로 분리해 운영합니다.
# - UI Backend가 향후 소비 기능을 사용할 경우 Business/Gateway 그룹과 충돌하지 않도록 별도 그룹명을 사용합니다.
spring.kafka.consumer.group-id=tc-ui-backend-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.nori.tc.messaging.kafka.contract.KafkaUiTaskMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# 수동 커밋 정책
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# ------------------------------------------------------------------------------
# 4. Topic 매핑 (메시징 스타터 공통 prefix + UI 분리 토픽 운영 템플릿)
# ------------------------------------------------------------------------------
# [중요] U1/U15 설계 기준
# - UI 이벤트 토픽은 business/gateway 용도로 분리합니다.
# - gateway 대상 토픽(tc.ui.events.gateway)은 U13 구현 이후 route_partition 명시 partition 발행을 사용합니다.
# - business 대상 토픽(tc.ui.events.business)은 일반 consumer-group 처리 대상입니다.
#
# 아래 default/ui-events 값은 "현재 미구현 UI Backend"의 호환 템플릿 기본값으로 business 토픽을 가리킵니다.
# U13 구현 시 실제 발행 로직은 이벤트 종류에 따라 gateway/business 토픽으로 분기해야 합니다.
tc.messaging.kafka.default-topic=tc.ui.events.business
tc.messaging.kafka.topic.ui-events=tc.ui.events.business
tc.messaging.kafka.topic.ui-commands=tc.ui.commands

# ------------------------------------------------------------------------------
# 4-1. UI 분리 토픽 템플릿 (U13 구현 시 사용 예정)
# ------------------------------------------------------------------------------
# Gateway 대상 UI 이벤트 토픽 (고정 route_partition 명시 발행 대상)
tc.ui-backend.kafka.topic.ui-events-gateway=tc.ui.events.gateway
# Business 대상 UI 이벤트 토픽 (일반 consumer-group 처리 대상)
tc.ui-backend.kafka.topic.ui-events-business=tc.ui.events.business
# Gateway 대상 발행은 route_partition 명시 partition 발행을 요구합니다. (U13 구현 예정)
tc.ui-backend.kafka.gateway-route-partition-required=true
