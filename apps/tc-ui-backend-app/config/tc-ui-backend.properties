# ==============================================================================
# TC-UI-BACKEND-APP 런타임 기본 설정
#
# 설계 배경
# - Front ↔ UI-backend: REST API 전용 (WebSocket/SSE 없음)
# - eqp_create/update/delete: DualResponse 방식 (gateway + business 양쪽 응답 대기)
# - eqp_start/end: 202 즉시 반환 + Redis polling 방식 (gateway 전담, 비동기)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Kafka 토픽 매핑
# ------------------------------------------------------------------------------
# Gateway 대상 UI 이벤트 토픽 (U13: route_partition 명시 partition 발행)
# - eqp_create/update/delete/start/end 모두 이 토픽으로 발행
# - 발행 시 tc_eqp.route_partition 기준 ProducerRecord(topic, partition, key, payload) 사용
tc.ui.backend.kafka.gateway-events-topic=tc.ui.events.gateway

# Business 대상 UI 이벤트 토픽 (일반 consumer-group 처리)
# - eqp_create/update/delete만 발행 (start/end는 gateway 전담)
tc.ui.backend.kafka.business-events-topic=tc.ui.events.business

# UI Backend가 응답을 수신하는 토픽 (gateway/business → UI backend 결과 전달)
tc.ui.backend.kafka.commands-topic=tc.ui.commands

# tc.ui.commands 파싱 실패 정책
# - DLT 적재 대신 WARN 로그 + kafka.command.parse_error 메트릭 + ACK로 처리합니다.

# Kafka 발행 동기 대기 타임아웃(초)
# - Gateway/Business publish()는 브로커 승인까지 동기 대기합니다.
# - 타임아웃 초과 시 UiKafkaPublishException을 발생시켜 컨트롤러가 즉시 실패를 감지합니다.
tc.ui.backend.kafka.publish-timeout-seconds=3

# Kafka 발행 메시지 사전 가드레일(바이트)
# - producer max.request.size 이하로 유지합니다.
tc.ui.backend.kafka.max-request-bytes=1048576
# 브로커/프로듀서 기본 제한과 동일 값으로 맞춰 pre-check 결과와 실제 브로커 거부 기준을 일치시킵니다.
spring.kafka.producer.properties.max.request.size=1048576

# Kafka metadata.source 값 (tc.ui.commands 응답 출처 구분용)
# - TC-COMM-GATEWAY: gateway 발행 응답
# - TC-BUSINESS-CORE: business 발행 응답
tc.ui.backend.kafka.source=TC-UI-BACKEND

# ------------------------------------------------------------------------------
# 2. 비동기 처리 정책
# ------------------------------------------------------------------------------
# DualResponse 대기 타임아웃 (eqp_create/update/delete: gateway + business 양쪽 응답 수집)
# - timeout 내에 양쪽 모두 응답하지 않으면 504 반환
# - eqp_update는 gateway 재시작 판단으로 응답이 늦을 수 있으므로 여유 있게 설정
tc.ui.backend.async.dual-request-timeout-ms=10000

# 비동기 결과 저장 TTL (eqp_start/end reply - Business Redis polling용)
# - front가 GET /api/async/{traceId}로 polling하는 최대 보관 기간
tc.ui.backend.async.result-ttl-seconds=600

# 비동기 결과 저장 키 prefix (Business Redis)
tc.ui.backend.async.result-key-prefix=tc:ui:backend:async:

# ------------------------------------------------------------------------------
# 3. 인증 설정
# ------------------------------------------------------------------------------
# 세션 토큰 유효 기간 (tc_ui_auth_session.expiresAt = issuedAt + ttl)
tc.ui.backend.auth.session-ttl-hours=8

# Business Redis 토큰 캐시 TTL (초)
# - 매 요청마다 DB 조회 방지, TTL 만료 시 재조회 후 재캐시
# - 값이 너무 크면 revoke 후에도 캐시가 유효한 시간이 길어짐 (보안 trade-off)
tc.ui.backend.auth.token-cache-ttl-seconds=300

# 인증 쿠키 이름 (HttpOnly Session Cookie)
tc.ui.backend.auth.cookie-name=TC_UI_AUTH

# 인증 쿠키 Path
# - UI 전체 경로에서 쿠키를 공유할 수 있도록 "/"를 기본값으로 사용합니다.
tc.ui.backend.auth.cookie-path=/

# 인증 쿠키 Domain (옵션)
# - 기본값은 비워 두어 요청 Host 기준(host-only) 쿠키로 동작시킵니다.
# - 필요 시 ".example.com" 형태로 설정해 서브도메인 간 공유가 가능합니다.
tc.ui.backend.auth.cookie-domain=

# 인증 쿠키 Secure 속성
# - 운영 기본값은 true이며 HTTPS 연결에서만 쿠키가 전송됩니다.
tc.ui.backend.auth.cookie-secure=true

# 인증 쿠키 SameSite 속성
# - 운영 기본값은 None이며 cross-origin 환경에서 쿠키 전송을 허용합니다.
tc.ui.backend.auth.cookie-same-site=None

# CSRF 쿠키/헤더 이름 계약
tc.ui.backend.auth.csrf-cookie-name=XSRF-TOKEN
tc.ui.backend.auth.csrf-header-name=X-XSRF-TOKEN

# CORS 허용 Origin 화이트리스트 (쉼표 구분)
# - 쿠키 기반 인증(allowCredentials=true)에서는 "*" 사용이 불가합니다.
# - 배포 환경 Origin을 명시적으로 등록하십시오.
tc.ui.backend.auth.cors-allowed-origins=

# 토큰 캐시 키 prefix (Business Redis)
tc.ui.backend.auth.token-cache-key-prefix=tc:ui:backend:session:

# ------------------------------------------------------------------------------
# 4. DLQ 키 prefix (Redis 조회용)
# ------------------------------------------------------------------------------
# Gateway Redis DLQ 조회 키 패턴 (tc:comm:gateway:dlq:{eqpId}:{messageId})
tc.ui.backend.dlq.gateway-key-prefix=tc:comm:gateway:dlq:

# Gateway Redis Quarantine 조회 키 패턴 (격리된 메시지 조회/해제용)
tc.ui.backend.dlq.gateway-quarantine-prefix=tc:comm:gateway:quarantine:

# Business Redis DLQ 조회 키 패턴 (tc:business:core:dlq:{eqpId}:{messageId})
tc.ui.backend.dlq.business-key-prefix=tc:business:core:dlq:
