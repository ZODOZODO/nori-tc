# ==============================================================================
# Redis 설정 [TC-UI-BACKEND-APP]
#
# 설계 배경
# - UI Backend는 Gateway Redis(6379)와 Business Redis(6380)에 동시 접속합니다.
# - spring.data.redis.* 미사용: Phase 4(tc-ui-redis-adapter)에서 각각
#   LettuceConnectionFactory를 직접 생성하므로 Spring Boot 기본 자동설정 불필요.
#
# 용도별 역할
# - Gateway Redis(6379): DLQ/Quarantine 항목 조회·삭제 (읽기 위주)
# - Business Redis(6380): DLQ 읽기 + 토큰 캐시(tc:ui:backend:session:{token})
#                         + eqp_start/end 비동기 결과 임시 저장(tc:ui:backend:async:{traceId})
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Gateway Redis 연결 설정 (port 6379)
# - DLQ 조회: tc:comm:gateway:dlq:*
# - Quarantine 조회: tc:comm:gateway:quarantine:*
# ------------------------------------------------------------------------------
tc.ui.backend.redis.gateway.host=192.168.0.22
tc.ui.backend.redis.gateway.port=6379
tc.ui.backend.redis.gateway.password=redis1234
# tc.ui.backend.redis.gateway.database=0
# tc.ui.backend.redis.gateway.ssl.enabled=false

# ------------------------------------------------------------------------------
# 2. Business Redis 연결 설정 (port 6380)
# - DLQ 조회: tc:business:core:dlq:*
# - 토큰 캐시: tc:ui:backend:session:{token}  TTL=tc.ui.backend.auth.token-cache-ttl-seconds
# - 비동기 결과: tc:ui:backend:async:{traceId}  TTL=tc.ui.backend.async.result-ttl-seconds
# ------------------------------------------------------------------------------
tc.ui.backend.redis.business.host=192.168.0.22
tc.ui.backend.redis.business.port=6380
tc.ui.backend.redis.business.password=redis1234
# tc.ui.backend.redis.business.database=0
# tc.ui.backend.redis.business.ssl.enabled=false
