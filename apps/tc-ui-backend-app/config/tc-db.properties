# ==============================================================================
# DB 설정 [TC-UI-BACKEND-APP]
#
# 설계 배경
# - UI Backend는 인증/인가 및 설비 라우팅 처리를 위해 DB를 사용합니다.
#
# 접근하는 주요 테이블:
#   - tc_user_info             : 사용자 계정 정보 조회 (로그인, 토큰 검증 시 상태 확인)
#   - tc_ui_auth_session       : UI 인증 세션 관리 (발급/폐기/만료 확인, lastSeenAt 갱신)
#   - tc_user_group_member     : 사용자 그룹 멤버십 조회 (권한 집계 중간 단계)
#   - tc_user_group_permission : 그룹별 권한 코드 조회 (권한 집계 중간 단계)
#   - tc_ui_permission         : 활성 UI API 권한 전체 조회 (기동 시 메모리 캐시 로드)
#   - tc_eqp                   : 설비별 route_partition 조회 (U13 Gateway 고정 파티션 발행용)
#
# 기술 선택
# - tc-db-postgres-jpa-starter 사용: PostgreSQL + JPA (Hibernate) 조합
# - DDL 자동 관리 비활성: ddl-auto=validate (스키마는 Flyway 없이 운영, 테이블 사전 생성 필요)
# ==============================================================================

################################################################################
# [A] DataSource (HikariCP) 옵션 (선택)
#
# UI Backend는 인증 요청마다 DB를 조회할 수 있으므로
# 적절한 커넥션 풀 크기를 운영 환경에 맞게 조정합니다.
################################################################################
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.connection-timeout=30000
# spring.datasource.hikari.idle-timeout=600000
# spring.datasource.hikari.max-lifetime=1800000

################################################################################
# [B] PostgreSQL 연결 설정 (ENABLED)
#
# 동일 DB 서버를 gateway / business / ui-backend 가 공유합니다.
# 각 앱은 읽기 전용 또는 제한된 쓰기 권한을 가진 계정 사용을 권장합니다.
################################################################################
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://192.168.0.22:5432/dev_tc
spring.datasource.username=nori
spring.datasource.password=REDACTED_DB_PASSWORD

################################################################################
# [C] JPA / Hibernate 설정 (ENABLED)
#
# UI Backend는 tc-db-postgres-jpa-starter를 사용합니다.
# ddl-auto=none: 스키마 DDL 작업을 전혀 수행하지 않습니다.
#
# UI Backend는 tc_user_info, tc_ui_auth_session, tc_user_group_member,
# tc_user_group_permission, tc_ui_permission, tc_eqp 테이블만 사용합니다.
# tc-db-jpa-common-schema에 포함된 다른 모듈의 Entity(tc_model 등) 스키마 변경으로
# validate 모드에서 기동 실패할 수 있으므로 none을 사용합니다.
# 스키마 정합성 검증은 gateway/business 앱에서 별도 수행합니다.
################################################################################
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Hibernate JDBC 타임존: UTC 고정
# - tc_ui_auth_session.expiresAt, lastSeenAt 등 OffsetDateTime 컬럼이 UTC 기준으로 저장됩니다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

################################################################################
# [D] 로그/디버그 옵션 (선택)
#
# 아래 설정은 개발/디버깅 시에만 주석 해제하여 사용합니다.
# 운영 환경에서는 성능 및 로그 용량 문제로 비활성화를 유지합니다.
################################################################################
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
