spring:
  application:
    name: tc-ui-backend-app

  main:
    # REST API 서버이므로 Servlet(Tomcat) 모드로 기동합니다.
    # - gateway/business는 web-application-type: none이지만 UI backend는 HTTP 서버 필요
    web-application-type: servlet

  autoconfigure:
    exclude:
      # UI Backend는 UiRedisConfiguration이 생성하는 gatewayLettuceConnectionFactory /
      # businessLettuceConnectionFactory 2개의 전용 연결을 사용합니다.
      # 아래 AutoConfiguration들은 단일 RedisConnectionFactory를 전제하므로
      # 2개의 factory가 있으면 NoUniqueBeanDefinitionException이 발생합니다.
      - com.nori.tc.db.starter.redis.TcDbRedisAutoConfiguration
      # Spring Boot의 Reactive Redis AutoConfiguration 제외 (UI Backend는 Servlet 전용)
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      # Spring Boot의 기본 Redis AutoConfiguration 제외
      # (redisTemplate, redisConnectionFactory는 UiRedisConfiguration이 전담 생성)
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      # Spring Data Redis Repositories AutoConfiguration 제외
      # (redisReferenceResolver 빈이 redisTemplate을 요구하므로 비활성)
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

  # 외부 설정 파일을 우선적으로 로딩합니다.
  # - optional 접두사: 파일 없어도 기동을 중단하지 않음
  # - file:config/... 경로는 실행 작업 디렉터리 기준
  config:
    import:
      - optional:file:config/tc-db.properties
      - optional:file:config/tc-messaging.properties
      - optional:file:config/tc-redis.properties
      - optional:file:config/tc-log.properties
      - optional:file:config/tc-ui-backend.properties
      # 활성 프로파일별 UI Backend 오버라이드 설정(예: local/dev/prod)을 선택적으로 로딩합니다.
      # - spring.profiles.active=local 인 경우: config/tc-ui-backend-local.properties
      # - optional 접두사로 파일이 없어도 기동은 계속됩니다.
      - optional:file:config/tc-ui-backend-${spring.profiles.active}.properties

logging:
  level:
    root: INFO
    # 프로젝트 패키지 로그 레벨 (DEBUG: 개발/운영 디버깅용)
    com.nori.tc: DEBUG
    # Kafka 내부 로그는 WARN으로 억제 (INFO 시 부팅 노이즈 과다)
    org.springframework.kafka: WARN
    org.apache.kafka: WARN

management:
  endpoints:
    web:
      # 운영 모니터링 엔드포인트를 /api 접두사 규칙으로 통일합니다.
      base-path: /api/actuator
