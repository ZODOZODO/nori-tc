# ============================================================================
# TC-BUSINESS-CORE-APP runtime 기본 설정
# ============================================================================

# 토픽별 consumer thread 고정 수 (요구사항: 토픽당 1개)
tc.business.core.kafka.eqp-events-topic=tc.eqp.events
tc.business.core.kafka.mes-events-topic=tc.mes.events
tc.business.core.kafka.ui-events-topic=tc.ui.events
tc.business.core.kafka.eqp-commands-topic=tc.eqp.commands
tc.business.core.kafka.mes-commands-topic=tc.mes.commands
tc.business.core.kafka.ui-commands-topic=tc.ui.commands
tc.business.core.kafka.eqp-events-consumer-threads=1
tc.business.core.kafka.mes-events-consumer-threads=1
tc.business.core.kafka.ui-events-consumer-threads=1

# Mailbox/Dispatcher 실행 설정
tc.business.core.runtime.dispatcher-threads=1
tc.business.core.runtime.worker-threads=8
tc.business.core.runtime.timeout-scheduler-threads=1
tc.business.core.runtime.topic-queue-capacity=10000
tc.business.core.runtime.mailbox-capacity=2048
tc.business.core.runtime.ack-drain-max-batch=512

# Retry/Timeout 정책
tc.business.core.runtime.task-timeout-ms=180000
tc.business.core.runtime.retry-max-attempts=3
tc.business.core.runtime.retry-backoff-ms=200

# Model runtime cache 정책
tc.business.core.model-cache.load-on-startup=true
tc.business.core.model-cache.fail-fast-on-startup=true
tc.business.core.model-cache.page-size=500

# Workflow plugin runtime preload 정책
tc.business.core.plugin-runtime.load-on-startup=true
tc.business.core.plugin-runtime.fail-fast-on-startup=true
tc.business.core.plugin-runtime.page-size=500

# UI task pipeline 정책
tc.business.core.ui-task.source=TC-BUSINESS-CORE-APP
tc.business.core.ui-task.duplicate-trace-ttl-ms=600000
tc.business.core.ui-task.task-retry-max-attempts=3
tc.business.core.ui-task.task-retry-backoff-ms=200
tc.business.core.ui-task.reply-retry-max-attempts=3
tc.business.core.ui-task.reply-retry-backoff-ms=200
# 테스트/로컬 환경 기본값은 false로 두고, 운영에서 true로 활성화합니다.
tc.business.core.ui-task.kafka-listener-enabled=false
