# ==============================================================================
# Redis 설정 [TC-BUSINESS-CORE-APP]
# - UI traceId dedup 및 DLQ 저장소로 사용합니다.
# - 운영 환경에서는 인증/SSL/클러스터 정책을 인프라 기준에 맞게 조정하십시오.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Spring Data Redis 연결 설정
# ------------------------------------------------------------------------------
spring.data.redis.host=192.168.0.13
spring.data.redis.port=6380
spring.data.redis.password=redis1234
# spring.data.redis.database=0
# spring.data.redis.ssl.enabled=false

# ------------------------------------------------------------------------------
# 2. Business Core Redis 정책
# ------------------------------------------------------------------------------
# DLQ 보관 TTL (초)
# - 0이면 만료 없이 보관합니다.
# - 예: 604800 = 7일
tc.business.core.redis.dlq-ttl-seconds=604800
