# ==============================================================================
# Messaging 설정 [TC-BUSINESS-CORE-APP]
# - 본 앱은 Kafka 기반으로 UI Task 수신/응답 및 이벤트 발행을 처리합니다.
# - Redis 관련 설정은 별도 tc-redis.properties에서 관리합니다.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka 공통 연결 정보
# ------------------------------------------------------------------------------
# Kafka 브로커 주소
spring.kafka.bootstrap-servers=192.168.0.22:9092

# ------------------------------------------------------------------------------
# 2. Kafka Producer 설정 (Business Core -> Kafka)
# ------------------------------------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# ------------------------------------------------------------------------------
# 3. Kafka Consumer 설정 (Kafka -> Business Core)
# ------------------------------------------------------------------------------
# Consumer Group 은 앱 단위로 분리해 운영합니다.
spring.kafka.consumer.group-id=tc-business-core-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.nori.tc.messaging.kafka.starter.contract.KafkaUiTaskMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# 수동 커밋 정책
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE

# ------------------------------------------------------------------------------
# 4. Topic 매핑 (메시징 스타터 공통 prefix)
# ------------------------------------------------------------------------------
# tc.business.core.* 토픽과 동일하게 맞춰 둡니다.
tc.messaging.kafka.default-topic=tc.eqp.events
tc.messaging.kafka.topic.eqp-events=tc.eqp.events
tc.messaging.kafka.topic.mes-events=tc.mes.events
tc.messaging.kafka.topic.ui-events=tc.ui.events
tc.messaging.kafka.topic.eqp-commands=tc.eqp.commands
tc.messaging.kafka.topic.mes-commands=tc.mes.commands
tc.messaging.kafka.topic.ui-commands=tc.ui.commands
