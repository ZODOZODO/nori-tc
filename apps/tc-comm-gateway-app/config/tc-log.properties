# ==============================================================================
# 공통 로그 설정 (tc-log-starter 연동)
# - 애플리케이션/설비 로그 패턴과 보관 정책을 정의합니다.
# - 서비스 공통 포맷을 유지하고, 필요한 경우 이 파일에서만 조정합니다.
# ==============================================================================

# 로그 출력 패턴
# - logger 축약(%logger{36})을 제거하고 클래스명만 출력(%logger{0})하여 가독성을 높입니다.
# - 예: c.n.t.c.k.p.PartitionCommitCoordinator -> PartitionCommitCoordinator
# - traceId/eqpId는 MDC 기반으로 채워집니다.
tc.logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS, Asia/Seoul} [%-5level] [%property{APP_NAME}] [%X{traceId}] %logger{0} - %msg [PROCESS_THREAD=%thread]%n
# 로그 파일 저장 기본 경로
tc.logging.file-dir=logs

# 애플리케이션 로그 롤링 정책
tc.logging.app.max-history=14
tc.logging.app.max-size=100MB
tc.logging.app.total-size-cap=5GB

# 설비 로그 롤링 정책
# 설비 로그는 logs/eqp/{eqpId}/ 디렉터리 하위에 저장됩니다.
tc.logging.eqp.max-history=14
tc.logging.eqp.max-size=100MB
tc.logging.eqp.total-size-cap=5GB
# 설비 로그 파일명 prefix (gateway/business 앱 구분)
tc.logging.eqp.file-prefix=gateway

# 로그 압축 정책
# - 최신 2일치 로그는 원본(.log) 유지
# - 그 이전 로그는 .gz 압축
# - scan interval 동안 주기적으로 정리 작업 수행
tc.logging.compress.enabled=true
tc.logging.compress.after-days=2
tc.logging.compress.scan-interval-minutes=60
