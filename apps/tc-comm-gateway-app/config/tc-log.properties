# ==============================================================================
# 공통 로그 설정 (tc-log-starter 연동)
# - 모든 앱에서 동일한 로그 패턴을 사용하도록 강제
# - 필요한 경우 이 파일에서만 패턴을 조정
# ==============================================================================

# 로그 패턴 (MDC: traceId, eqpId 포함)
tc.logging.pattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [${APP_NAME}] [%X{traceId}] %logger{36} - %msg%n [PROCESS_THREAD=%thread]

# 설비별 로그 파일 저장 경로
tc.logging.file-dir=logs

# 앱 구동/운영 로그 롤링 정책
tc.logging.app.max-history=14
tc.logging.app.max-size=100MB
tc.logging.app.total-size-cap=5GB

# 설비별 로그 롤링 정책
tc.logging.eqp.max-history=14
tc.logging.eqp.max-size=100MB
tc.logging.eqp.total-size-cap=5GB

# 로그 압축 정책
# - 최근 2일치는 .log 유지
# - 2일 지난 로그부터 .gz 압축
tc.logging.compress.enabled=true
tc.logging.compress.after-days=2
tc.logging.compress.scan-interval-minutes=60
