# ==============================================================================
# Messaging Configuration for [TC-COMM-GATEWAY-APP]
# Role: 설비 통신 게이트웨이
# - Producer: 설비 이벤트(Events)를 Kafka로 보냄
# - Consumer: 제어 명령(Commands)을 Kafka에서 받음
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka
# ------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092

# [Producer] (설비 -> Kafka)
# - 중복 전송 방지 (Idempotence) 필수
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# [Consumer] (Kafka -> 설비)
# - Group ID: Gateway 전용 (다른 앱과 겹치면 안 됨)
# - Offset: latest (과거 명령 무시, 실시간 제어 우선)
spring.kafka.consumer.group-id=tc-comm-gateway-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# [Safety] 수동 커밋 & 순차 처리 보장
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.concurrency=3

# ------------------------------------------------------------------------------
# [Topic Mappings]
# Gateway가 주로 사용하는 토픽 정의
# ------------------------------------------------------------------------------
# 1. Outbound (Gateway가 발행하는 토픽)
tc.messaging.kafka.topic.eqp-events=tc.eqp.events
tc.messaging.kafka.topic.ui-events=tc.ui.events

# 2. Inbound (Gateway가 구독하는 토픽)
tc.messaging.kafka.topic.eqp-commands=tc.eqp.commands
tc.messaging.kafka.topic.ui-commands=tc.ui.commands


# ------------------------------------------------------------------------------
# 2. RabbitMQ (Optional)
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual

tc.messaging.rabbitmq.exchange=tc.direct.exchange
tc.messaging.rabbitmq.routing-key.eqp=tc.eqp.route
tc.messaging.rabbitmq.queue.eqp=tc.eqp.queue


# ------------------------------------------------------------------------------
# 3. Tibco RV (Gateway에서 구형 설비 연결 시 사용)
# ------------------------------------------------------------------------------
# 예: 구형 설비용 인스턴스
tc.messaging.tibrv.instances.legacy-eqp.daemon=tcp:7500
tc.messaging.tibrv.instances.legacy-eqp.service=7500
tc.messaging.tibrv.instances.legacy-eqp.network=;
tc.messaging.tibrv.instances.legacy-eqp.subject.target=TC.TO.EQP.COMMAND
tc.messaging.tibrv.instances.legacy-eqp.subject.listener=EQP.TO.TC.EVENT