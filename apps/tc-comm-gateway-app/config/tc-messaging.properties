# ==============================================================================
# Messaging 설정 [TC-COMM-GATEWAY-APP]
# 역할
# - Producer: 장비 이벤트(Events)를 Kafka로 발행
# - Consumer: 상위 시스템 명령(Commands)을 Kafka에서 수신
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka
# ------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092

# [Producer] (장비 -> Kafka)
# - enable.idempotence=true 로 중복 전송 방지
# - acks=all 로 브로커 복제본까지 확인 후 성공 처리
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# [Consumer] (Kafka -> 장비)
# - group-id 는 게이트웨이 전용으로 유지
# - auto-offset-reset=latest 로 신규 컨슈머 시작 시 최신 오프셋부터 처리
spring.kafka.consumer.group-id=tc-comm-gateway-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.nori.tc.messaging.kafka.starter.contract.KafkaCommandMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# [Safety] 수동 커밋 + 즉시 처리 결과 반영
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.concurrency=3

# ------------------------------------------------------------------------------
# Topic 매핑
# - Gateway가 기본적으로 사용하는 이벤트/명령 토픽
# ------------------------------------------------------------------------------
# Outbound (Gateway가 발행)
tc.messaging.kafka.topic.eqp-events=tc.eqp.events
tc.messaging.kafka.topic.ui-events=tc.ui.events

# Inbound (Gateway가 구독)
tc.messaging.kafka.topic.eqp-commands=tc.eqp.commands
tc.messaging.kafka.topic.ui-commands=tc.ui.commands


# ------------------------------------------------------------------------------
# 2. RabbitMQ (선택)
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual

tc.messaging.rabbitmq.exchange=tc.direct.exchange
tc.messaging.rabbitmq.routing-key.eqp=tc.eqp.route
tc.messaging.rabbitmq.queue.eqp=tc.eqp.queue


# ------------------------------------------------------------------------------
# 3. Tibco RV
# - 게이트웨이에서 구형 장비 연계가 필요한 경우 사용
# ------------------------------------------------------------------------------
# legacy-eqp 인스턴스 예시
tc.messaging.tibrv.instances.legacy-eqp.daemon=tcp:7500
tc.messaging.tibrv.instances.legacy-eqp.service=7500
tc.messaging.tibrv.instances.legacy-eqp.network=;
tc.messaging.tibrv.instances.legacy-eqp.subject.target=TC.TO.EQP.COMMAND
tc.messaging.tibrv.instances.legacy-eqp.subject.listener=EQP.TO.TC.EVENT
