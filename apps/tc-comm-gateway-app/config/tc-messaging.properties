# ==============================================================================
# Messaging 설정 [TC-COMM-GATEWAY-APP]
# - 게이트웨이 애플리케이션이 사용하는 Kafka/RabbitMQ/Tibco RV 통신 속성을 정의합니다.
# - 운영 환경 변경 시 토픽/브로커 주소를 우선 점검하고, 소비자 그룹 ID 충돌 여부를 함께 확인하십시오.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka 공통 연결 정보
# ------------------------------------------------------------------------------
# Kafka bootstrap 서버 목록입니다.
spring.kafka.bootstrap-servers=192.168.0.13:9092

# ------------------------------------------------------------------------------
# 1-1. Kafka Producer 설정 (Gateway -> Kafka)
# ------------------------------------------------------------------------------
# key/value 직렬화 방식입니다. value는 JSON 직렬화를 사용합니다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# 중복 전송 방지를 위한 멱등성(idempotence) 설정입니다.
spring.kafka.producer.properties.enable.idempotence=true
# 모든 ISR 복제를 확인한 후 ack를 받도록 강제합니다.
spring.kafka.producer.acks=all
# 일시 장애 복구를 위해 재시도 횟수를 충분히 크게 둡니다.
spring.kafka.producer.retries=2147483647

# ------------------------------------------------------------------------------
# 1-2. Kafka Consumer 설정 (Kafka -> Gateway)
# ------------------------------------------------------------------------------
# 게이트웨이 소비자 그룹 식별자입니다.
spring.kafka.consumer.group-id=tc-comm-gateway-group
# 오프셋이 없을 때 최신 메시지부터 읽습니다.
spring.kafka.consumer.auto-offset-reset=latest
# key/value 역직렬화 방식입니다. value는 Spring JsonDeserializer를 사용합니다.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# 신뢰 패키지 범위를 열어 두되, 운영 환경에서는 필요 시 축소를 검토하십시오.
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# 기본 value 타입은 command envelope로 지정하며, 실제 소비 토픽/파이프라인에 맞춰 override 됩니다.
spring.kafka.consumer.properties.spring.json.value.default.type=com.nori.tc.comm.adapters.kafka.contract.GatewayBusinessCommandMessage
# 타입 헤더를 사용하지 않고 애플리케이션 설정 기준으로 역직렬화합니다.
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# 소비자 안전 설정
# - 자동 커밋 비활성화
# - 처리 완료 시점 수동 커밋
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
# 리스너 동시성(consumer thread 수)입니다.
spring.kafka.listener.concurrency=3

# ------------------------------------------------------------------------------
# 1-3. Kafka Topic 매핑
# ------------------------------------------------------------------------------
# Outbound (Gateway 발행)
tc.messaging.kafka.topic.eqp-events=tc.eqp.events
# MES 연동 토픽입니다. 운영 계약에 맞춰 라우팅 정책과 함께 관리하십시오.
tc.messaging.kafka.topic.mes-events=tc.mes.events
tc.messaging.kafka.topic.mes-commands=tc.mes.commands
# Gateway -> UI 응답/알림 토픽입니다.
tc.messaging.kafka.topic.ui-commands=tc.ui.commands

# Inbound (Gateway 수신)
tc.messaging.kafka.topic.eqp-commands=tc.eqp.commands
# UI -> Gateway 작업 요청 토픽입니다. (U1: UI 이벤트 토픽 분리)
# - Gateway는 이 토픽을 ASSIGN + ownedPartitions 방식으로 소비합니다.
# - Gateway 대상 UI 이벤트는 route_partition 고정 라우팅(명시 partition 발행) 정책을 따릅니다. (U13 구현 시 발행 측 반영)
tc.messaging.kafka.topic.ui-events=tc.ui.events.gateway


# ------------------------------------------------------------------------------
# 2. RabbitMQ (대체 채널/레거시 연계)
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# 수동 ack 모드에서 메시지 1건씩 안전하게 처리합니다.
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual

tc.messaging.rabbitmq.exchange=tc.direct.exchange
tc.messaging.rabbitmq.routing-key.eqp=tc.eqp.route
tc.messaging.rabbitmq.queue.eqp=tc.eqp.queue


# ------------------------------------------------------------------------------
# 3. Tibco RV (레거시 연동)
# ------------------------------------------------------------------------------
tc.messaging.tibrv.instances.legacy-eqp.daemon=tcp:7500
tc.messaging.tibrv.instances.legacy-eqp.service=7500
tc.messaging.tibrv.instances.legacy-eqp.network=;
tc.messaging.tibrv.instances.legacy-eqp.subject.target=TC.TO.EQP.COMMAND
tc.messaging.tibrv.instances.legacy-eqp.subject.listener=EQP.TO.TC.EVENT
