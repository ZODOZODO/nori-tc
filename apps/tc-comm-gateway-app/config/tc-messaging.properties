# ==============================================================================
# Messaging ?ㅼ젙 [TC-COMM-GATEWAY-APP]
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka
# ------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=192.168.0.22:9092

# [Producer] Gateway -> Kafka 諛쒗뻾 ?ㅼ젙
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# [Consumer] Kafka -> Gateway ?섏떊 ?ㅼ젙
spring.kafka.consumer.group-id=tc-comm-gateway-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# value.default.type? 由ъ뒪?덈퀎(eq.p command / ui task)濡?肄붾뱶?먯꽌 override ?⑸땲??
# 湲곕낯媛믪? ?좉퇋 command envelope ??낆쑝濡?留욎땅?덈떎.
spring.kafka.consumer.properties.spring.json.value.default.type=com.nori.tc.comm.adapters.kafka.contract.GatewayBusinessCommandMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# [Safety] ?섎룞 而ㅻ컠 ?뺤콉
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.concurrency=3

# ------------------------------------------------------------------------------
# Topic 留ㅽ븨
# ------------------------------------------------------------------------------
# Outbound (Gateway 諛쒗뻾)
tc.messaging.kafka.topic.eqp-events=tc.eqp.events
# MES ?뺣났 ?좏뵿? Gateway?먯꽌 吏곸젒 ?ъ슜?섏? ?딆?留? ?좏뵿 怨꾩빟 ?듭씪???꾪빐 紐낆떆?⑸땲??
tc.messaging.kafka.topic.mes-events=tc.mes.events
tc.messaging.kafka.topic.mes-commands=tc.mes.commands
# Gateway -> UI ?묐떟 諛쒗뻾 ?좏뵿
tc.messaging.kafka.topic.ui-commands=tc.ui.commands

# Inbound (Gateway 援щ룆)
tc.messaging.kafka.topic.eqp-commands=tc.eqp.commands
# UI -> Gateway task ?섏떊 ?좏뵿
tc.messaging.kafka.topic.ui-events=tc.ui.events


# ------------------------------------------------------------------------------
# 2. RabbitMQ (?좏깮)
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual

tc.messaging.rabbitmq.exchange=tc.direct.exchange
tc.messaging.rabbitmq.routing-key.eqp=tc.eqp.route
tc.messaging.rabbitmq.queue.eqp=tc.eqp.queue


# ------------------------------------------------------------------------------
# 3. Tibco RV (?덇굅??
# ------------------------------------------------------------------------------
tc.messaging.tibrv.instances.legacy-eqp.daemon=tcp:7500
tc.messaging.tibrv.instances.legacy-eqp.service=7500
tc.messaging.tibrv.instances.legacy-eqp.network=;
tc.messaging.tibrv.instances.legacy-eqp.subject.target=TC.TO.EQP.COMMAND
tc.messaging.tibrv.instances.legacy-eqp.subject.listener=EQP.TO.TC.EVENT

