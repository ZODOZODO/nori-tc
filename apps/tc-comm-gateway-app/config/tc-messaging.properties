# ==============================================================================
# Messaging 설정 [TC-COMM-GATEWAY-APP]
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Apache Kafka
# ------------------------------------------------------------------------------
spring.kafka.bootstrap-servers=192.168.0.22:9092

# [Producer] Gateway -> Kafka 발행 설정
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647

# [Consumer] Kafka -> Gateway 수신 설정
spring.kafka.consumer.group-id=tc-comm-gateway-group
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# value.default.type은 리스너별(eq.p command / ui task)로 코드에서 override 됩니다.
# 기본값은 신규 command envelope 타입으로 맞춥니다.
spring.kafka.consumer.properties.spring.json.value.default.type=com.nori.tc.comm.adapters.kafka.messaging.contract.GatewayBusinessCommandMessage
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# [Safety] 수동 커밋 정책
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.concurrency=3

# ------------------------------------------------------------------------------
# Topic 매핑
# ------------------------------------------------------------------------------
# Outbound (Gateway 발행)
tc.messaging.kafka.topic.eqp-events=tc.eqp.events
# MES 왕복 토픽은 Gateway에서 직접 사용하지 않지만, 토픽 계약 통일을 위해 명시합니다.
tc.messaging.kafka.topic.mes-events=tc.mes.events
tc.messaging.kafka.topic.mes-commands=tc.mes.commands
# Gateway -> UI 응답 발행 토픽
tc.messaging.kafka.topic.ui-commands=tc.ui.commands

# Inbound (Gateway 구독)
tc.messaging.kafka.topic.eqp-commands=tc.eqp.commands
# UI -> Gateway task 수신 토픽
tc.messaging.kafka.topic.ui-events=tc.ui.events


# ------------------------------------------------------------------------------
# 2. RabbitMQ (선택)
# ------------------------------------------------------------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.acknowledge-mode=manual

tc.messaging.rabbitmq.exchange=tc.direct.exchange
tc.messaging.rabbitmq.routing-key.eqp=tc.eqp.route
tc.messaging.rabbitmq.queue.eqp=tc.eqp.queue


# ------------------------------------------------------------------------------
# 3. Tibco RV (레거시)
# ------------------------------------------------------------------------------
tc.messaging.tibrv.instances.legacy-eqp.daemon=tcp:7500
tc.messaging.tibrv.instances.legacy-eqp.service=7500
tc.messaging.tibrv.instances.legacy-eqp.network=;
tc.messaging.tibrv.instances.legacy-eqp.subject.target=TC.TO.EQP.COMMAND
tc.messaging.tibrv.instances.legacy-eqp.subject.listener=EQP.TO.TC.EVENT
