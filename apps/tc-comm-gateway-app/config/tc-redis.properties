# ==============================================================================
# Redis 설정 [TC-COMM-GATEWAY-APP]
# - 런타임 상태 캐시, DLQ, Quarantine 저장소로 사용합니다.
# - 운영 환경에서는 Cluster/Sentinel, 인증, SSL 옵션을 함께 검토하세요.
# ==============================================================================

spring.data.redis.host=192.168.0.13
spring.data.redis.port=6379
spring.data.redis.password=redis1234
# spring.data.redis.database=0
# spring.data.redis.ssl.enabled=false

# ------------------------------------------------------------------------------
# Gateway Redis 사용 옵션
# ------------------------------------------------------------------------------
# DLQ TTL (초)
# - 0이면 만료 없음
# - 운영 정책에 맞춰 보관 기간을 조정하세요.
# - 예: 604800 = 7일
# ------------------------------------------------------------------------------
tc.comm.gateway.redis.dlq-ttl-seconds=604800

# Quarantine TTL (초)
# - 격리 데이터는 운영자 확인/해제 흐름과 맞춰 만료 시간을 설정하세요.
# - 값이 너무 짧으면 원인 분석 전에 데이터가 사라질 수 있습니다.
# ------------------------------------------------------------------------------
tc.comm.gateway.redis.quarantine-ttl-seconds=1209600
