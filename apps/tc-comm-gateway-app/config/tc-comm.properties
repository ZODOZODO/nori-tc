# ==============================================================================
# TC-COMM-GATEWAY 런타임/통신 공통 설정
# - 장비 통신 처리량, 큐 크기, 재조립 버퍼, Netty/Kafka 동작을 제어합니다.
# - 운영 환경에서는 장비 트래픽 특성에 맞춰 단계적으로 조정하세요.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Gateway Runtime (인바운드 처리/격리 정책)
# ------------------------------------------------------------------------------
# 인바운드 큐 용량 (bounded queue)
# - 장비에서 수신한 원문 메시지를 처리 대기열에 적재할 때 사용하는 최대 개수입니다.
# - 큐가 가득 차면 드롭 또는 DLQ/Quarantine 정책으로 이어지므로 모니터링이 필요합니다.
# ------------------------------------------------------------------------------
tc.comm.gateway.runtime.inbound-queue-capacity=2048

# 재조립(reassembly) 버퍼 크기 (bytes)
# - initial: 초기 버퍼 크기
# - max: 최대 버퍼 상한 (과도한 메모리 사용 방지)
# ------------------------------------------------------------------------------
tc.comm.gateway.runtime.reassembly-initial-bytes=4096
# 1MB 상한 (운영 환경 트래픽에 맞게 조정)
tc.comm.gateway.runtime.reassembly-max-bytes=1048576

# 드레인(draining) 1회 실행 시 처리할 최대 청크 수
# - 값이 너무 크면 단일 루프가 CPU를 오래 점유할 수 있습니다.
# - 값이 너무 작으면 처리 지연이 증가할 수 있습니다.
# ------------------------------------------------------------------------------
tc.comm.gateway.runtime.max-chunks-per-drain=64

# 인바운드 처리 worker thread 수
# - 장비 수와 메시지 빈도에 따라 조정합니다.
# - 과도한 스레드 증가는 컨텍스트 스위칭 비용을 늘릴 수 있습니다.
# ------------------------------------------------------------------------------
tc.comm.gateway.runtime.worker-threads=8

# ------------------------------------------------------------------------------
# 2. HSMS 기본 설정
# ------------------------------------------------------------------------------
# 기본 deviceId
# - 장비별 값이 필요한 경우 DB/캐시에서 장비 기준 값으로 override 하세요.
# ------------------------------------------------------------------------------
tc.comm.gateway.hsms.device-id=0

# HSMS Timer (ms): T3/T5/T6/T7/T8
tc.comm.gateway.hsms.timer.t3-reply-timeout-ms=45000
tc.comm.gateway.hsms.timer.t5-connect-timeout-ms=10000
tc.comm.gateway.hsms.timer.t6-control-timeout-ms=5000
tc.comm.gateway.hsms.timer.t7-not-selected-timeout-ms=10000
tc.comm.gateway.hsms.timer.t8-network-interleave-timeout-ms=5000

# Linktest 활성화 및 실행 주기
tc.comm.gateway.hsms.linktest-enabled=true
tc.comm.gateway.hsms.linktest-interval-ms=30000

# HSMS 프레임 상한 및 Selected 상태 강제 여부
tc.comm.gateway.hsms.max-frame-bytes=262144
tc.comm.gateway.hsms.require-select-before-data=true

# ------------------------------------------------------------------------------
# 3. SOCKET 기본 설정
# ------------------------------------------------------------------------------
# 기본 socketType
# - 장비별 socketType이 다르면 DB/설정 저장소에서 장비 기준으로 override 권장
# ------------------------------------------------------------------------------
tc.comm.gateway.socket.default-socket-type=LINE_DELIMITED

# SOCKET 프레임 상한 및 빈 프레임 허용 여부
tc.comm.gateway.socket.max-frame-bytes=262144
tc.comm.gateway.socket.allow-empty-frame=false
tc.comm.gateway.socket.regex-end-pattern=END\\n
# ------------------------------------------------------------------------------
# 4. Publish Policy (OUTBOX vs DIRECT_KAFKA)
# ------------------------------------------------------------------------------
# - rules에 매칭되면 해당 규칙의 publish mode를 적용합니다.
# - default-mode는 rules에 매칭되지 않는 메시지에 적용됩니다.
# ------------------------------------------------------------------------------
tc.comm.gateway.publish-policy.version=default-v1
# PublishPolicySpec 변경 시각(epoch ms). 운영 정책 변경 이력 관리에 활용
tc.comm.gateway.publish-policy.updated-at-epoch-ms=1770766363663
tc.comm.gateway.publish-policy.default-mode=OUTBOX

# 예시) 특정 메시지 타입을 직접 Kafka로 발행하고 싶을 때
# tc.comm.gateway.publish-policy.rules[0].match-type=EXACT
# tc.comm.gateway.publish-policy.rules[0].pattern=EVT_STATUS
# tc.comm.gateway.publish-policy.rules[0].publish-mode=DIRECT_KAFKA
# tc.comm.gateway.publish-policy.rules[0].topic=tc.eqp.events
# tc.comm.gateway.publish-policy.rules[0].key=eqpId

# ------------------------------------------------------------------------------
# 5. Outbound Runtime
# ------------------------------------------------------------------------------
tc.comm.gateway.runtime.outbound-queue-capacity=1024
tc.comm.gateway.runtime.max-outbound-per-drain=64
tc.comm.gateway.runtime.outbound-retry-max=3
tc.comm.gateway.runtime.outbound-retry-backoff-ms=200
tc.comm.gateway.runtime.outbound-retry-scheduler-threads=1

# ------------------------------------------------------------------------------
# 6. Kafka Shard Ownership
# ------------------------------------------------------------------------------
tc.comm.gateway.kafka.commands-partition-count=6
tc.comm.gateway.kafka.owned-partitions=0,1,2,3,4,5
tc.comm.gateway.kafka.poll-timeout-ms=1000
tc.comm.gateway.kafka.ui-poll-timeout-ms=1000
tc.comm.gateway.kafka.commit-retry-max=1
tc.comm.gateway.kafka.commit-retry-backoff-ms=200
tc.comm.gateway.kafka.lag-sample-interval-ms=5000
tc.comm.gateway.kafka.consumer-shutdown-wait-ms=3000
tc.comm.gateway.kafka.admin-timeout-seconds=5

# ------------------------------------------------------------------------------
# 6-1. UI Task Policy (tc.ui.events -> tc.ui.commands)
# ------------------------------------------------------------------------------
# UI task 이벤트별 처리 타임아웃(ms)
tc.comm.gateway.ui-task.create-timeout-ms=30000
tc.comm.gateway.ui-task.update-timeout-ms=30000
tc.comm.gateway.ui-task.delete-timeout-ms=30000
tc.comm.gateway.ui-task.start-timeout-ms=30000
tc.comm.gateway.ui-task.end-timeout-ms=30000
tc.comm.gateway.ui-task.send-message-timeout-ms=30000
tc.comm.gateway.ui-task.update-jarfile-timeout-ms=30000

# UI task 처리 재시도 정책
tc.comm.gateway.ui-task.task-retry-max=1
tc.comm.gateway.ui-task.task-retry-backoff-ms=200

# UI reply 발행 재시도 정책
tc.comm.gateway.ui-task.reply-publish-retry-max=3
tc.comm.gateway.ui-task.reply-publish-retry-backoff-ms=200

# 동일 traceId 중복 수신 스킵 정책
tc.comm.gateway.ui-task.duplicate-trace-ttl-ms=600000

# 커밋 보류 후 동일 레코드 재시도 backoff(ms)
tc.comm.gateway.ui-task.failed-record-retry-backoff-ms=500

# ------------------------------------------------------------------------------
# 7. Netty (TCP)
# ------------------------------------------------------------------------------
tc.comm.gateway.netty.boss-threads=1
tc.comm.gateway.netty.worker-threads=4
tc.comm.gateway.netty.hsms-bind-port=5000
tc.comm.gateway.netty.socket-bind-port=5001
tc.comm.gateway.netty.bind-timeout-seconds=5
tc.comm.gateway.netty.bind-executor-threads=2
tc.comm.gateway.netty.unbound-buffer-max-bytes=8192
tc.comm.gateway.netty.unbound-buffer-initial-bytes=256
tc.comm.gateway.netty.connect-timeout-millis=5000
tc.comm.gateway.netty.active-reconnect-delay-ms=3000
tc.comm.gateway.netty.reconnect-scheduler-threads=1
tc.comm.gateway.netty.socket-send-initialize-on-connect=true
tc.comm.gateway.netty.socket-initialize-command=CMD=INITIALIZE\\n
tc.comm.gateway.netty.socket-initialize-reply-prefix=CMD=INITIALIZE_REP
tc.comm.gateway.netty.socket-eqp-id-key=EQPID

# ------------------------------------------------------------------------------
# 8. Observability (로그 샘플링)
# ------------------------------------------------------------------------------
tc.comm.gateway.observability.command-drop-log-every=100
tc.comm.gateway.observability.bind-timeout-log-every=1
tc.comm.gateway.observability.duplicate-reject-log-every=1
tc.comm.gateway.observability.queue-overflow-log-every=1
tc.comm.gateway.observability.commit-fail-log-every=1
tc.comm.gateway.observability.not-owner-log-every=1
